[package]
name = "ewatts-protocol"
version = "0.1.0"
edition = "2021"
description = "Ewatts — Memory-Bound Proof-of-Work protocol node"

[[bin]]
name = "ewatts-protocol"
path = "src/main.rs"

[[bin]]
name = "steady-bench"
path = "src/bin/steady_bench.rs"
required-features = []
license = "MIT"

[dependencies]
sha3 = "0.10"
digest = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core", "fast"] }
curve25519-dalek = { version = "4", features = ["group", "digest", "serde"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = { version = "0.2", features = ["std"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"

[dependencies.libp2p]
version = "0.54"
features = [
    "full",
    "gossipsub",
    "mdns",
    "noise",
    "yamux",
    "request-response",
    "tokio",
]

[features]
default = ["testnet"]
testnet = []
mainnet = []

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
