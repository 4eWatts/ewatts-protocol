[package]
name = "ewatts-protocol"
version = "0.1.0"
edition = "2021"
description = "Ewatts — Memory-Bound Proof-of-Work protocol node"
license = "MIT"

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ed25519-dalek = "2"

[profile.release]
lto = true
codegen-units = 1
